[package]
name = "vauchi-wasm"
version = "0.5.0-rc.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "WASM bindings for vauchi-core (web demo)"

[lib]
crate-type = ["cdylib"]

[dependencies]
vauchi-core = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.98.0", version = "=0.98.0", default-features = false }
vauchi-app = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.98.0", version = "=0.98.0", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
overflow-checks = true

# rqrr 0.11.0 with the clamped Perspective::map lives in vauchi/utils/rqrr.
# A [patch] applies only inside the workspace that declares it, so every
# consumer of vauchi-core resolves upstream rqrr from crates.io unless it
# redirects too. That costs core's Perspective::map clamp, without which a
# near-degenerate QR perspective aborts under panic=abort
# (problems/2026-05-25-rqrr-perspective-panic-crashes-qr-scan).
[patch.crates-io]
rqrr = { git = "https://gitlab.com/vauchi/utils/rqrr.git", tag = "v0.11.0+vauchi.1" }
