[files]
extend-exclude = [
    "*.png",
    "*.wasm",
    "wasm/pkg/",
    "wasm/target/",
    "dist/",
    "node_modules/",
    "package-lock.json",
]

[default.extend-words]
# flate2 is a Rust compression crate name (not a typo for "flat").
flate = "flate"
# `writeable` is an ICU4X crate name (not a typo for "writable"). It reaches
# the staged diff via supply-chain/config.toml, which cargo-vet rewrites
# wholesale on `vet fmt`, so an unrelated exemption edit re-stages the line.
writeable = "writeable"
